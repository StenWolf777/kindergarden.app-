<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Bog'chaOS Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261027d">
  <script>try { const t = localStorage.getItem('bogcha_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    .auth-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.3s ease;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .auth-logo .logo-text h2 { color: var(--text-primary); }
    .auth-logo .logo-text h2 span { color: var(--text-secondary); }
    .auth-logo .badge-saas { color: var(--text-secondary); }
    .auth-header {
      margin-bottom: 24px;
    }
    .auth-header h1 {
      font-size: 1.55rem;
      margin-bottom: 6px;
    }
    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }
    .auth-page .custom-input { width: 100%; min-height: 44px; font-size: 16px; }
    .auth-page .btn { justify-content: center; min-height: 44px; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-text">
        <h2>Bog'cha<span>OS</span></h2>
        <span class="badge-saas" data-i18n="login.secureAccess">Xavfsiz Kirish</span>
      </div>
      <button class="icon-button lang-toggle" id="langToggle" title="Tilni almashtirish" data-i18n-title="topbar.lang.title" style="margin-left:auto;">
        <span id="langToggleLabel">UZ</span>
      </button>
    </div>

    <div class="auth-header">
      <h1 data-i18n="login.heading">Tizimga Kirish</h1>
      <p id="authSubtitle" data-i18n="login.subtitle">"EXKLUZIV DELUXE" boshqaruv portaliga xush kelibsiz.</p>
    </div>

    <form id="passwordLoginForm" onsubmit="handlePasswordLogin(event)">
      <div class="form-group">
        <label for="loginPhone" data-i18n="login.phoneLabel">Telefon raqam</label>
        <input type="tel" id="loginPhone" required class="custom-input" placeholder="+998 90 111 22 33" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="loginPassword" data-i18n="login.passwordLabel">Parol</label>
        <input type="password" id="loginPassword" required class="custom-input" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-4" id="loginSubmitBtn" data-i18n="login.submit">
        Tizimga kirish
      </button>
    </form>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="i18n.js?v=20261027d"></script>
  <script>
    const API_BASE = 'http://127.0.0.1:8000/api/v1';

    async function handlePasswordLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginSubmitBtn');
      btn.innerText = t('login.checking');

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('bogcha_user', JSON.stringify(data.user));
          localStorage.setItem('bogcha_token', data.token);
          showToast(t('login.welcome', { name: data.user.name }), 'success');
          setTimeout(() => {
            window.location.href = `index.html?t=${Date.now()}`;
          }, 800);
        } else {
          showToast(data.detail || t('login.failed'), 'warning');
          btn.innerText = t('login.submit');
        }
      } catch (err) {
        showToast(t('login.networkError'), 'warning');
        btn.innerText = t('login.submit');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const text = document.createElement('span');
      text.textContent = message;
      toast.appendChild(text);
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function updateLangToggleLabel() {
      const label = document.getElementById('langToggleLabel');
      if (label) label.textContent = getLang() === 'uz' ? 'RU' : 'UZ';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations(document);
      updateLangToggleLabel();
      document.getElementById('langToggle')?.addEventListener('click', () => {
        setLang(getLang() === 'uz' ? 'ru' : 'uz');
        applyTranslations(document);
        updateLangToggleLabel();
      });
    });
  </script>
</body>
</html>
